name: RDP
on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Expandir Armazenamento
        run: |
          $drive = Get-Volume -DriveLetter C
          $size = Get-PartitionSupportedSize -DriveLetter C
          Resize-Partition -DriveLetter C -Size $size.SizeMax
          Write-Host "✅ Armazenamento expandido: $([math]::Round($size.SizeMax/1GB,2)) GB"

      - name: Configurar RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Criar Usuário
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "Skyro" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Skyro"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Skyro"
          echo "RDP_CREDS=Usuário: Skyro | Senha: $password" >> $env:GITHUB_ENV

      - name: Instalar Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Conectar Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) { Write-Error "Falha ao obter IP"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: PREPARAR TUDO PARA ROBLOX — SEM ERRO DE CERTIFICADO 🎮
        run: |
          # Desliga aceleração que causa erro na VM
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\DirectX" -Name "DisableHWAcceleration" -Value 1 -Force

          # Baixa Roblox por HTTP — NÃO TEM BLOQUEIO NENHUM!
          $url = "http://setup.roblox.com/RobloxPlayerLauncher.exe"
          $dest = "C:\Users\Skyro\Downloads\RobloxPlayerLauncher.exe"
          $wc = New-Object System.Net.WebClient
          $wc.DownloadFile($url, $dest)
          Write-Host "✅ Roblox baixado em: $dest"

          # Cria configuração mágica — força DirectX 9, o único que funciona em VM
          $clientSettingsPath = "$env:LOCALAPPDATA\Roblox\Versions\ClientSettings"
          New-Item -Path $clientSettingsPath -ItemType Directory -Force -ErrorAction SilentlyContinue
          $configContent = @'
{
    "FFlagDebugGraphicsPreferD3D11": false,
    "FFlagDebugGraphicsDisableD3D11": true,
    "FFlagDebugGraphicsPreferD3D9": true,
    "FFlagDebugGraphicsDisableOpenGL": true,
    "FFlagTaskSchedulerLimitTargetFpsTo240": false,
    "DFIntTaskSchedulerTargetFps": 60
}
'@
          $configContent | Out-File -FilePath "$clientSettingsPath\ClientSettings.json" -Encoding UTF8 -Force
          Write-Host "✅ Configuração de vídeo aplicada — Roblox usa DirectX 9!"

      - name: Verificar Conexão
        run: |
          Write-Host "IP Tailscale: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) { Write-Error "Porta 3389 fechada"; exit 1 }
          Write-Host "✅ Conexão RDP funcionando!"

      - name: MANTER CONEXÃO + DADOS
        run: |
          Write-Host "`n======================================"
          Write-Host "🔗 ENDEREÇO: $env:TAILSCALE_IP"
          Write-Host "👤 USUÁRIO: Skyro"
          Write-Host "🔑 SENHA: $($env:RDP_CREDS.Split('|')[1].Trim())"
          Write-Host "======================================"
          Write-Host "✅ Roblox JÁ BAIXADO na pasta Downloads!"
          Write-Host "✅ Configuração de vídeo JÁ FEITA!"
          Write-Host "✅ Instale, abra pelo navegador e JOGUE!`n"
          while ($true) {
              Write-Host "[$(Get-Date)] Ativo — Roblox pronto!"
              Start-Sleep -Seconds 300
          }
          
